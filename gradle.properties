# Project-wide Gradle settings.

# JVM heap for the Gradle daemon itself (not your app). Default is often too
# small for an Android build with Compose.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8

# Run subprojects in parallel where the dependency graph allows it.
org.gradle.parallel=true

# AndroidX (vs. the old support library) — required by every AndroidX artifact.
android.useAndroidX=true

# Kotlin code style used by IDE formatting; has no effect on the build output.
kotlin.code.style=official

# Non-transitive R classes: each module's generated R class only contains
# resources it declares itself, not everything from its dependencies too.
# Faster incremental builds, and required practice for AGP 9.
android.nonTransitiveRClass=true

# AGP 9's new default is "built-in Kotlin" (AGP compiles Kotlin itself,
# no separate org.jetbrains.kotlin.android plugin) plus a new android{}
# DSL. Both are very recent (2026) and documentation on how the Compose
# compiler plugin's version needs to line up with built-in Kotlin's
# internal compiler version is incomplete as of this writing — there's an
# open Google issue tracker entry in that exact area (438678642). Since
# Stage 1's whole purpose is a *verifiable* pipeline and this is the first
# CI run that will ever compile this code, we opt into the traditional,
# well-documented setup instead: the classic org.jetbrains.kotlin.android
# plugin, explicitly pinned to the same Kotlin version as the Compose
# compiler plugin. AGP 9.3 still fully supports this (it's only slated for
# removal in AGP 10); revisit this once built-in Kotlin has more mileage.
android.builtInKotlin=false
android.newDsl=false
