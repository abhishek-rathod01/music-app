# Project-wide Gradle settings.

# JVM heap for the Gradle daemon itself (not your app). Default is often too
# small for an Android build with Compose.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8

# Run subprojects in parallel where the dependency graph allows it.
org.gradle.parallel=true

# AndroidX (vs. the old support library) — required by every AndroidX artifact.
android.useAndroidX=true

# Kotlin code style used by IDE formatting; has no effect on the build output.
kotlin.code.style=official

# Non-transitive R classes: each module's generated R class only contains
# resources it declares itself, not everything from its dependencies too.
# Faster incremental builds, and required practice for AGP 9.
android.nonTransitiveRClass=true

# We initially opted out of AGP 9's built-in-Kotlin default here
# (android.builtInKotlin=false, android.newDsl=false) to use the
# traditional org.jetbrains.kotlin.android plugin, on the theory that it
# was the better-documented, lower-risk path for a first-ever CI compile.
# The first real CI run proved that reasoning backwards: on AGP 9.3.0,
# that opt-out combination makes the old `android {}` extension,
# `kotlinOptions {}`, and `jvmTarget` all fail as script *compile errors*,
# not warnings — see the PR discussion for the actual log. AGP's own error
# message pointed at the fix: use the default (built-in Kotlin + new DSL),
# which is what happens when neither property is set here. So: no
# properties needed — built-in Kotlin is on by not overriding it.
