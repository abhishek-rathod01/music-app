[versions]
# Confirmed by web search on 2026-08-23 — see the PR description for sourcing
# and confidence notes on each of these.
agp = "9.3.0"
kotlin = "2.4.0"
composeBom = "2026.08.00"
activityCompose = "1.13.0"
junit = "4.13.2"
# Confirmed by web search on 2026-08-23 (overnight A-D build): GitHub
# releases page shows 1.11.0 as latest, released 2026-05-08, built against
# Kotlin 2.2.20. High confidence on "latest stable" (two independent
# searches agreed); coroutines maintains a stable ABI across newer Kotlin
# stdlib versions so building against Kotlin 2.4.0 here is expected to be
# fine, but this specific combination has never been compiled anywhere —
# see ENVIRONMENT.md. First real signal is CI.
coroutines = "1.11.0"
# Phase B, confirmed by web search 2026-08-25. High confidence: the
# official androidx/media GitHub release tag 1.11.0 exists and explicitly
# documents MediaSession changes, confirming media3-session ships at the
# same version (all media3-* artifacts release in lockstep). minSdk 23 and
# compileSdk>=35 requirements both comfortably satisfied by this project's
# minSdk 26 / compileSdk 37.
media3 = "1.11.0"
# Phase B. Medium-high confidence: two independent searches agreed on
# 4.16.1 (released 2026-01-21), and one explicitly noted 4.16 supports
# "Android Baklava" (SDK 36) — our compileSdk is 37, one API level past
# what that note confirmed. Flagged as a real risk, not hidden: if CI fails
# with an unsupported-SDK error from Robolectric specifically (not a
# generic compile error), that's the first thing to check.
robolectric = "4.16.1"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"
lifecycle = "2.11.0"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
# No version needed: this artifact is managed by the Compose BOM platform
# (already applied via implementation(platform(libs.compose.bom))), same as
# compose-material3 above. Needed because PlayerScreen uses several icons
# (Shuffle, Repeat, RepeatOne, MusicNote) that live only in the "extended"
# icon set, not the smaller core set material3 pulls in on its own.
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
# Media3's own official Robolectric test helpers (RobolectricUtil,
# TestPlayerRunHelper) — same version as the other media3-* artifacts,
# confirmed to exist via web search 2026-08-25 (the API reference page and
# a GitHub issue both reference RobolectricUtil.runMainLooperUntil from
# this exact package/artifact).
media3-test-utils-robolectric = { group = "androidx.media3", name = "media3-test-utils-robolectric", version.ref = "media3" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# Separate artifact from lifecycle-runtime-ktx above: this one specifically
# provides the Compose extension collectAsStateWithLifecycle used to
# observe PlaybackViewModel.state.
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
